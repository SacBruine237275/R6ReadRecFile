name: .NET CD - Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Linux
        run: |
          dotnet publish R6ReadRecFile.CLI -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none -o ./publish/linux
          mv ./publish/linux/R6ReadRecFile.CLI ./R6ReadRecFile-linux-x64

      - name: Publish Windows
        run: |
          dotnet publish R6ReadRecFile.CLI -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none -o ./publish/windows
          mv ./publish/windows/R6ReadRecFile.CLI.exe ./R6ReadRecFile-win-x64.exe

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v0.2.0
          name: Release v0.2.0
          body: "Automatic release from main branch."
          files: |
            R6ReadRecFile-linux-x64
            R6ReadRecFile-win-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
